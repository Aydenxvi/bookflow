[project]
name = "bookflow-bot"
version = "0.1.0"
description = "BookFlow Telegram bot (aiogram 3.x) — launches the Mini App, nothing more."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4.0",
    "pydantic-settings>=2.6,<3.0",
]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
