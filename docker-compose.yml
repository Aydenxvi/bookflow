# NOTE (session 2, 2026-11-10): this file has now actually been run with
# `docker compose up` for real (api/web/worker/postgres, on the user's own
# machine) — two real bugs turned up and were fixed that way: apps/worker's
# pyproject.toml needed setuptools auto-discovery instead of an explicit
# packages list (see git history), and apps/api's CORS was hardcoded to
# exactly localhost:5173/:4173, which broke as soon as a port had to be
# remapped to avoid colliding with other local projects. The `bot` service
# (profile "bot") still hasn't been run against real Telegram servers from
# inside this repo's own sessions, but a real BOT_TOKEN now exists for it,
# per NEXT_STEPS.md's live-deployment work.
#
# apps/worker does NOT fail fast without TELEGRAM_BOT_TOKEN — it runs its
# full claim/retry loop regardless, failing individual sends cleanly instead
# of crashing — so it's in the default `docker compose up`, not gated behind
# a profile, unlike `bot` which fails fast without one.
#
# The `caddy` service (profile "prod") is for a real VPS deployment only —
# see README.md's "Deploying to a real VPS" section.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookflow}
      POSTGRES_DB: ${POSTGRES_DB:-bookflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bookflow_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bookflow}:${POSTGRES_PASSWORD:-bookflow}@postgres:5432/${POSTGRES_DB:-bookflow}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_DEMO_BUSINESS_SLUG: ${DEMO_BUSINESS_SLUG:-atelier}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  worker:
    build: ./apps/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bookflow}:${POSTGRES_PASSWORD:-bookflow}@postgres:5432/${POSTGRES_DB:-bookflow}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # Opt-in: `docker compose --profile bot up` only. It fails fast without a
  # real BOT_TOKEN (see apps/bot/README.md), so it's excluded from the
  # default `docker compose up` to avoid crash-looping when no token is set.
  bot:
    build: ./apps/bot
    env_file:
      - apps/bot/.env
    profiles: ["bot"]
    depends_on:
      - api

  # Opt-in: `docker compose --profile prod up` only — reverse proxy + automatic
  # HTTPS (Let's Encrypt) for a real VPS deployment, not local dev (local dev
  # reaches api/web directly on their host-mapped ports and has no real
  # domain to get a certificate for). Requires DOMAIN set in .env to a real
  # hostname that resolves to this server. See README.md's "Deploying to a
  # real VPS" section and infrastructure/caddy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to your server's real hostname}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - bookflow_caddy_data:/data
      - bookflow_caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  bookflow_postgres_data:
  bookflow_caddy_data:
  bookflow_caddy_config:
