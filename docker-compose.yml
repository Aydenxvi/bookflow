# NOTE (session 1, 2026-11-01): this file was written against the spec's
# requirements but has NOT itself been run in this session — the sandbox
# this project was built in has no Docker daemon available, so PostgreSQL
# was run as a native OS service instead and the API/tests were run
# directly with uvicorn/pytest (see PROGRESS.md for exactly what was
# verified that way). Treat this file as "should work, not yet proven" until
# someone runs `docker compose up` on a machine with Docker and confirms it.
#
# apps/bot doesn't have a Dockerfile yet because there's no real Telegram
# bot token available in this environment (see NEXT_STEPS.md) — apps/web now
# does, and is wired in below, but like the api service above it has not
# itself been exercised through `docker compose up` here.
#
# apps/worker (Phase 4) is wired in below too, same caveat. Unlike apps/bot
# it does NOT fail fast without TELEGRAM_BOT_TOKEN — it runs its full
# claim/retry loop regardless, failing individual sends cleanly instead of
# crashing — so it's in the default `docker compose up`, not gated behind a
# profile.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookflow}
      POSTGRES_DB: ${POSTGRES_DB:-bookflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bookflow_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bookflow}:${POSTGRES_PASSWORD:-bookflow}@postgres:5432/${POSTGRES_DB:-bookflow}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_DEMO_BUSINESS_SLUG: ${DEMO_BUSINESS_SLUG:-atelier}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  worker:
    build: ./apps/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bookflow}:${POSTGRES_PASSWORD:-bookflow}@postgres:5432/${POSTGRES_DB:-bookflow}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # Opt-in: `docker compose --profile bot up` only. It fails fast without a
  # real BOT_TOKEN (see apps/bot/README.md), so it's excluded from the
  # default `docker compose up` to avoid crash-looping when no token is set.
  bot:
    build: ./apps/bot
    env_file:
      - apps/bot/.env
    profiles: ["bot"]
    depends_on:
      - api

volumes:
  bookflow_postgres_data:
